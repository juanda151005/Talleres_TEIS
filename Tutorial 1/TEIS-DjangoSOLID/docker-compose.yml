version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password

  web:
    build: .
    # CAMBIO VITAL: Ahora usamos Gunicorn y llamamos a Tienda.wsgi
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    depends_on:
      - db
    environment:
      # (Estas variables no cambian, déjalas como estaban apuntando a 'db' local)
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
    # CAMBIO VITAL: ¿Te diste cuenta? ¡Ya borramos la sección 'ports' de aquí!

    # CAMBIO VITAL: Este es el nuevo servicio del proxy
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80" # Nginx es el unico que da la cara a internet
    volumes:
      # Inyectamos el archivo nginx.conf que creaste en el paso anterior
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
